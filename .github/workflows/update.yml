# Keeps the GitHub Pages version of AI Jump Lab up to date:
# fetches prices, runs the signal detectors, commits new signals to
# signals/signals.jsonl, and redeploys the site with fresh data.
name: Update board

on:
  schedule:
    # Every 5 minutes, Mon-Fri, 13:00-21:59 UTC. That covers US market hours
    # (9:30am-4pm New York) in both summer and winter time. GitHub often
    # starts scheduled runs late, so expect gaps of 5-15+ minutes.
    - cron: "*/5 13-21 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit the signal log
  pages: write
  id-token: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch prices and detect signals
        run: node scripts/snapshot.js

      - name: Save new signals to the repo
        run: |
          git add signals/
          if git diff --cached --quiet; then
            echo "No new signals."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Log signals $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
